name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 💎 Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      
      - name: 🍫 Install/Update CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version
      
      - name: 🍎 Show Xcode version
        run: |
          xcodebuild -version
          node --version
          npm --version
      
      - name: 📦 Install npm dependencies
        run: npm ci || npm install
      
      - name: 🌐 Build React web app
        run: |
          export CI=false
          export GENERATE_SOURCEMAP=false
          npm run build
          ls -la build/ | head -5
      
      - name: 🧹 Clean iOS folder
        run: rm -rf ios
      
      - name: 🍎 Add iOS platform
        run: |
          npx cap add ios --verbose 2>&1 || true
          
          echo "════════════════════════════════════"
          echo "After cap add ios:"
          echo "════════════════════════════════════"
          
          if [ -d "ios" ]; then
            echo "ios/ contents:"
            ls -la ios/
            
            if [ -d "ios/App" ]; then
              echo "ios/App contents:"
              ls -la ios/App/
            fi
          else
            echo "::error::ios/ folder was not created!"
            exit 1
          fi
      
      - name: 🔄 Capacitor sync
        run: |
          npx cap sync ios --verbose 2>&1 || true
          
          echo "════════════════════════════════════"
          echo "After cap sync ios:"
          echo "════════════════════════════════════"
          ls -la ios/App/
      
      - name: 🍫 Explicit pod install
        run: |
          cd ios/App
          echo "Podfile content:"
          cat Podfile || echo "Podfile not found!"
          echo "════════════════════════════════════"
          
          # Force install pods (creates xcworkspace)
          pod install --verbose 2>&1 | tail -50
          
          echo "════════════════════════════════════"
          echo "After pod install:"
          ls -la
      
      - name: 🔍 Locate xcworkspace
        run: |
          echo "Searching for xcworkspace files:"
          find ios -name "*.xcworkspace" -type d 2>/dev/null
          echo ""
          echo "Searching for xcodeproj files:"
          find ios -name "*.xcodeproj" -type d 2>/dev/null
      
      - name: ✅ Verify workspace exists
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "::error::App.xcworkspace still missing!"
            echo "Full ios/App listing:"
            ls -la ios/App/
            exit 1
          fi
          echo "✅ App.xcworkspace exists"
      
      - name: 🛠️ Build unsigned archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            archive
      
      - name: 📦 Create IPA file
        run: |
          cd ios/App/build
          
          if [ ! -d "App.xcarchive/Products/Applications/App.app" ]; then
            echo "::error::App.app not found!"
            ls -la App.xcarchive/Products/Applications/ || true
            exit 1
          fi
          
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -qr KaroGroup.ipa Payload
          rm -rf Payload
          
          echo "✅ IPA created:"
          ls -lh KaroGroup.ipa
      
      - name: ⬆️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KaroGroup-IPA-${{ github.run_number }}
          path: ios/App/build/KaroGroup.ipa
          retention-days: 30
          if-no-files-found: error
      
      - name: 📝 Summary
        if: success()
        run: |
          echo "## 🎉 IPA دروستکرا!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
