name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 🍎 Show Xcode version
        run: |
          xcodebuild -version
          node --version
          npm --version
      
      - name: 📦 Install npm dependencies
        run: npm ci || npm install
      
      - name: 🌐 Build React web app
        run: |
          export CI=false
          export GENERATE_SOURCEMAP=false
          npm run build
          du -sh build/ || true
      
      - name: 🧹 Clean iOS folder
        run: rm -rf ios
      
      - name: 🍎 Add iOS platform
        run: |
          npx cap add ios
          echo "════════════════════════════════════"
          echo "After cap add ios:"
          echo "════════════════════════════════════"
          ls -la ios/App/
      
      - name: 🔄 Capacitor sync
        run: |
          npx cap sync ios
          echo "════════════════════════════════════"
          echo "After cap sync ios:"
          echo "════════════════════════════════════"
          ls -la ios/App/
      
      - name: 📋 List schemes (debug)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -list
      
      - name: 🛠️ Build unsigned archive (using xcodeproj for SPM)
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            archive
      
      - name: 📦 Create IPA file
        run: |
          cd ios/App/build
          
          if [ ! -d "App.xcarchive/Products/Applications/App.app" ]; then
            echo "::error::App.app not found!"
            ls -la App.xcarchive/Products/Applications/ || true
            exit 1
          fi
          
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -qr KaroGroup.ipa Payload
          rm -rf Payload
          
          echo "✅ IPA created:"
          ls -lh KaroGroup.ipa
      
      - name: ⬆️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KaroGroup-IPA-${{ github.run_number }}
          path: ios/App/build/KaroGroup.ipa
          retention-days: 30
          if-no-files-found: error
      
      - name: 📝 Summary
        if: success()
        run: |
          echo "## 🎉 IPA دروستکرا!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**هەنگاوەکانی نصب:**" >> $GITHUB_STEP_SUMMARY
          echo "1. دابگرە IPA لە Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. AirDrop بۆ iPhone" >> $GITHUB_STEP_SUMMARY
          echo "3. Filza → Install" >> $GITHUB_STEP_SUMMARY
